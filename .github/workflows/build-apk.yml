name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest calistiricilarinda Android SDK zaten kurulu gelir
      # (ANDROID_SDK_ROOT onceden tanimli). Sadece eksik bilesenleri kuruyoruz.
      - name: SDK bilesenlerini kur
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: APK'yi derle
        run: gradle assembleDebug --no-daemon

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: OrionMonitor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
